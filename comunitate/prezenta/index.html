      { text: '✏️ Redenumește…', fa: async () => { const t = await intreaba('Titlul coloanei', titluColoana(c)); if (t != null) schimba(() => { if (t && t !== c.titlu) configAxa().titluri[id] = t; else delete configAxa().titluri[id]; if (proprie) configAxa().proprii.find((p) => p.id === id).titlu = t || c.titlu; }); } },
      { text: selectie.chei.size > 1 ? `Ascunde coloanele (${selectie.chei.size})` : 'Ascunde coloana', fa: () => schimba(() => { configAxa().ascunse.push(...selectie.chei); golesteSelectia(); }) },
      vizibile.indexOf(id) > 0 && { text: '← Mută la stânga', fa: () => mutaCuUnPas(id, -1) },
      vizibile.indexOf(id) < vizibile.length - 1 && { text: '→ Mută la dreapta', fa: () => mutaCuUnPas(id, 1) },
      { text: '❄ Îngheață până aici', fa: () => schimba(() => { setari.aspect.inghetate = vizibile.indexOf(id) + 1; }) },
      setari.aspect.inghetate > 0 && { text: 'Dezgheață coloanele', fa: () => schimba(() => { setari.aspect.inghetate = 0; }) },
      setari.latimi[`${setari.axa}|${id}`] && { text: 'Lățimea obișnuită', fa: () => schimba(() => { delete setari.latimi[`${setari.axa}|${id}`]; }) },
      c.ora && { text: `📄 Raport pentru ora din ${c.ora.titlu}`, fa: () => deschideRaport('sedinta', c.ora.id) },
      c.elev && { text: `📄 Raport pentru ${c.elev.nume}`, fa: () => deschideRaport('elev', c.elev.cheie) },
      '-',
      { text: 'B  Îngroșat', scurt: 'Ctrl+B', fa: () => comutaFormat('gros') },
      ...paleteFormat(),
      { text: '🧹 Șterge formatarea coloanei', fa: stergeFormatarea },
      proprie && '-',
      proprie && { text: '🗑 Șterge coloana', fa: () => stergeColoanaProprie(id) },

  }

  async function scrieNota(rid, cid) {
    const t = await intreaba('Notă', date.note[cheieCel(rid, cid)] ?? '', { rand: false });
    if (t == null) return;
    schimba(() => { if (t) date.note[cheieCel(rid, cid)] = t; else delete date.note[cheieCel(rid, cid)]; });
  }

  function stergeColoanaProprie(id) {
    schimba(() => {
      const cfg = configAxa();
      cfg.proprii = cfg.proprii.filter((p) => p.id !== id);
      cfg.ordine = cfg.ordine.filter((x) => x !== id);
      cfg.ascunse = cfg.ascunse.filter((x) => x !== id);
      cfg.sortari = cfg.sortari.filter((s) => s.coloana !== id);
      delete cfg.filtre[id]; delete cfg.format[id]; delete cfg.titluri[id];
      delete date.valori[id];
      golesteSelectia();
    });
  }

  async function coloanaNoua() {
    const titlu = await intreaba('Titlul coloanei noi', 'Observații');
    if (!titlu) return;
    schimba(() => { configAxa().proprii.push({ id: `p:${Date.now().toString(36)}`, titlu }); });

  /* ---------- Fereastra de filtru (ca ▾ din Excel) ---------- */
  function deschideFiltrul(id, langa) {
    const c = toateColoanele().find((x) => x.id === id);
    if (!c) return;
    const pop = $('#popover-filtru');
    const excluse = new Set(configAxa().filtre[id] ?? []);
    const valori = [...new Set([...randuriFiltrate(coloaneVizibile(), id).map((r) => textFiltru(c, r)), ...excluse])]
      .sort((a, b) => String(a).localeCompare(String(b), 'ro', { numeric: true }));
    pop.innerHTML = `
      <strong>${escapa(titluColoana(c))}</strong>
      <button type="button" class="btn" data-f="sus">↓ Sortează A→Z (de la mic la mare)</button>
      <button type="button" class="btn" data-f="jos">↑ Sortează Z→A (de la mare la mic)</button>
      <input type="search" placeholder="🔍 Caută" aria-label="Caută în valori">
      <div class="valori">
        <label><input type="checkbox" data-f="tot" ${excluse.size ? '' : 'checked'}> <b>(Selectează tot)</b></label>
        ${valori.map((v) => `<label data-v="${escapa(cheieDin(v))}"><input type="checkbox" value="${escapa(v)}" ${excluse.has(v) ? '' : 'checked'}> ${escapa(v)}</label>`).join('')}
      </div>
      <div class="rand-p" style="justify-content:flex-end">
        <button type="button" class="btn" data-f="sterge">Șterge filtrul</button>
        <button type="button" class="btn principal" data-f="ok">OK</button>
      </div>`;
    const r = (langa ?? cadru).getBoundingClientRect();
    pozitioneaza(pop, r.left, r.bottom + 4);
    const cutii = () => [...pop.querySelectorAll('.valori input[value]')];
    pop.querySelector('input[type=search]').addEventListener('input', (ev) => {
      const t = cheieDin(ev.target.value);
      pop.querySelectorAll('.valori label[data-v]').forEach((l) => { l.hidden = Boolean(t) && !l.dataset.v.includes(t); });
    });
    pop.onchange = (ev) => {
      if (ev.target.dataset.f === 'tot') cutii().forEach((x) => { if (!x.closest('label').hidden) x.checked = ev.target.checked; });
      else pop.querySelector('[data-f="tot"]').checked = cutii().every((x) => x.checked);
    };
    pop.onclick = (ev) => {
      const f = ev.target.closest('[data-f]')?.dataset.f;
      if (f === 'sus' || f === 'jos') { inchideMeniurile(); schimba(() => { configAxa().sortari = [{ coloana: id, directie: f === 'sus' ? 1 : -1 }]; }); }
      if (f === 'sterge') { inchideMeniurile(); schimba(() => { delete configAxa().filtre[id]; }); }
      if (f === 'ok') {
        const scoase = cutii().filter((x) => !x.checked).map((x) => x.value);
        inchideMeniurile();
        schimba(() => { if (scoase.length) configAxa().filtre[id] = scoase; else delete configAxa().filtre[id]; });
      }
    };
    pop.querySelector('input[type=search]').focus();
  }

  /* =========================================================
     11. TASTATURA (ca în Excel)
     ========================================================= */

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { if (!meniu.hidden || !$('#popover-filtru').hidden) { inchideMeniurile(); return; } if (pensula) { pensula = null; deseneazaPanglica(); return; } if (selectie.tip) { golesteSelectia(); marcheazaSelectia(); } return; }
    if (ev.target.closest('input, textarea, select, [contenteditable="true"], dialog')) return;
    const ctrl = ev.ctrlKey || ev.metaKey;
    const tasta = ev.key.toLowerCase();
    if (ctrl && tasta === 'z' && !ev.shiftKey) { ev.preventDefault(); anuleaza(); return; }
    if (ctrl && (tasta === 'y' || (tasta === 'z' && ev.shiftKey))) { ev.preventDefault(); reface(); return; }
    if (ctrl && tasta === 'b') { ev.preventDefault(); comutaFormat('gros'); return; }
    if (ctrl && tasta === 'i') { ev.preventDefault(); comutaFormat('cursiv'); return; }
    if (ctrl && tasta === 'u') { ev.preventDefault(); comutaFormat('subliniat'); return; }
    if (ctrl && tasta === 'c' && selectie.tip && !String(getSelection())) { ev.preventDefault(); copiazaSelectia(); return; }
    if (ctrl && tasta === 'a' && document.activeElement === cadru) { ev.preventDefault(); selectie = { tip: 'celule', chei: new Set(afisat.ids.flatMap((r) => afisat.coloane.map((c) => r + SEP + c.id))), ancora: null }; marcheazaSelectia(); return; }
    if ((ev.key === 'Delete' || ev.key === 'Backspace') && selectie.tip === 'celule') {
      const proprii = new Set(configAxa().proprii.map((p) => p.id));
      const deSters = celuleSelectate().filter(([, c]) => proprii.has(c) );
      if (deSters.length) { ev.preventDefault(); schimba(() => deSters.forEach(([r, c]) => { if (date.valori[c]) delete date.valori[c][r]; })); }
      return;
    }
    if (ev.key === 'F2' && selectie.tip === 'celule' && selectie.ancora) {
      const { rid, cid } = selectie.ancora;
      const cel = cadru.querySelector(`tr[data-rand="${CSS.escape(rid)}"] [data-col="${CSS.escape(cid)}"]`);
      if (cel) { ev.preventDefault(); editeazaCelula(cel); }
      return;
    }
    const sageti = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (sageti[ev.key] && selectie.tip === 'celule' && selectie.ancora && document.activeElement === cadru) {
      ev.preventDefault();
      const [dr, dc] = sageti[ev.key];
      const ids = afisat.ids; const cols = afisat.coloane.map((c) => c.id);
      const pornire = ev.shiftKey && selectie.capat ? selectie.capat : selectie.ancora;
      const rid = ids[Math.max(0, Math.min(ids.length - 1, ids.indexOf(pornire.rid) + dr))];
      const cid = cols[Math.max(0, Math.min(cols.length - 1, cols.indexOf(pornire.cid) + dc))];
      if (ev.shiftKey) { selecteazaInterval(rid, cid, false); }
      else selectie = { tip: 'celule', chei: new Set([rid + SEP + cid]), ancora: { rid, cid } };
      marcheazaSelectia();
      cadru.querySelector(`tr[data-rand="${CSS.escape(rid)}"] [data-col="${CSS.escape(cid)}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
  });

  /* =========================================================

     ========================================================= */

  const FILE = [['acasa', 'Acasă'], ['inserare', 'Inserare'], ['date', 'Date'], ['conditionata', 'Formatare condiționată'], ['clase', 'Clase'], ['simboluri', 'Simboluri'], ['aspect', 'Aspect'], ['vizualizare', 'Vizualizare']];
  const TEME = [['auto', 'Automată (ca sistemul)'], ['luminoasa', 'Luminoasă'], ['intunecata', 'Întunecată'], ['hartie', 'Hârtie'], ['verde', 'Verde școlar'], ['bordo', 'Bordo'], ['contrast', 'Contrast mare'], ['noapte', 'Noapte albastră']];

  const grup = (eticheta, continut) => `<div class="grup-p"><div class="unelte">${continut}</div><div class="eticheta-grup">${eticheta}</div></div>`;
  const buton = (act, text, { titlu = '', apasat = null, date: d = '', dezactivat = false, clasa = '' } = {}) =>
    `<button type="button" class="btn ${clasa}" data-act="${act}" ${d}${titlu ? ` title="${escapa(titlu)}" aria-label="${escapa(titlu)}"` : ''}${apasat != null ? ` aria-pressed="${apasat}"` : ''}${dezactivat ? ' disabled' : ''}>${text}</button>`;
  const optiuni = (lista, valoare) => lista.map(([v, t]) => `<option value="${escapa(v)}"${String(v) === String(valoare) ? ' selected' : ''}>${escapa(t)}</option>`).join('');
  const valoareLa = (cale) => cale.split('.').reduce((o, k) => o?.[k], setari);
  const alege = (cale, lista, eticheta) => `<label class="inline">${eticheta ? `<span class="mic">${eticheta}</span>` : ''}<select data-set="${cale}" aria-label="${escapa(eticheta || cale)}">${optiuni(lista, valoareLa(cale))}</select></label>`;
  const numar_ = (cale, eticheta, min, max, pas = 1, unitate = '') => `<label class="inline"><span class="mic">${eticheta}</span><input type="number" data-set="${cale}" min="${min}" max="${max}" step="${pas}" value="${escapa(valoareLa(cale))}" style="inline-size:68px" aria-label="${escapa(eticheta)}">${unitate ? `<span class="mic">${unitate}</span>` : ''}</label>`;
  const glisor = (cale, eticheta, min, max, pas = 1) => `<label class="inline"><span class="mic">${eticheta}</span><input type="range" data-set="${cale}" min="${min}" max="${max}" step="${pas}" value="${escapa(valoareLa(cale))}" aria-label="${escapa(eticheta)}"></label>`;
  const bifa = (cale, text) => `<label class="inline"><input type="checkbox" data-set="${cale}" ${valoareLa(cale) ? 'checked' : ''}> ${text}</label>`;

  /** Un selector de culoare cu buton ↺ pentru „automat”. Cheia spune ce culoare schimbă. */
  function alegatorCuloare(cheie, eticheta, valoare, automat) {
    const c = culoareSigura(valoare);
    const implicit = c || (automat ? culoareCss(automat) : culoareCss('var(--foaie)'));
    return `<label class="culoare ${c ? '' : 'auto'}" title="${escapa(eticheta)}${c ? '' : ' (automat)'}">
      <input type="color" data-culoare="${escapa(cheie)}" value="${escapa(implicit)}" aria-label="${escapa(eticheta)}">
      <span>${escapa(eticheta)}</span>
      <button type="button" data-automat="${escapa(cheie)}" aria-label="${escapa(eticheta)}: înapoi la automat">↺</button>
    </label>`;
  }
  const memorieCuloriCss = new Map();
  /** Transformă o culoare CSS (de ex. var(--albastru)) în hex, doar ca punct de pornire al selectorului. */
  function culoareCss(css) {
    const cheie = `${document.documentElement.dataset.tema ?? ''}|${css}`;
    if (memorieCuloriCss.has(cheie)) return memorieCuloriCss.get(cheie);
    const proba = document.createElement('span');
    proba.style.color = css;
    document.body.append(proba);
    const [r, g, b] = (getComputedStyle(proba).color.match(/[\d.]+/g) ?? [0, 0, 0]).map(Number);
    proba.remove();
    const hex = `#${[r, g, b].map((x) => Math.round(x).toString(16).padStart(2, '0')).join('')}`;
    memorieCuloriCss.set(cheie, hex);
    return hex;
  }

        ${buton('fmt', '<b>B</b>', { titlu: 'Îngroșat (Ctrl+B)', apasat: apasat('gros'), date: 'data-p="gros" ', clasa: 'icon' })}
        ${buton('fmt', '<i>I</i>', { titlu: 'Cursiv (Ctrl+I)', apasat: apasat('cursiv'), date: 'data-p="cursiv" ', clasa: 'icon' })}

        ${alegatorCuloare('sel:text', 'A', f.text, 'var(--text)')}
        ${alegatorCuloare('sel:fundal', '🪣', f.fundal, null)}`),
      grup('Aliniere', ['left', 'center', 'right'].map((a, i) => buton('aliniaza', ['⇤', '≡', '⇥'][i], { titlu: ['La stânga', 'La mijloc', 'La dreapta'][i], apasat: f.aliniere === a, date: `data-v="${a}" `, clasa: 'icon' })).join('')
        + buton('fmt', '↵ Încadrează', { titlu: 'Textul lung trece pe rândul următor', apasat: apasat('incadrare'), date: 'data-p="incadrare" ' })),

  function filaConditionata() {
    const cfg = configAxa();
    const coloane = [['@ore', setari.axa === 'elevi' ? 'Orice oră' : 'Orice elev'], ...coloaneOrdonate().filter((c) => !c.nrcrt && !c.stare).map((c) => [c.id, titluColoana(c)]), ...coloaneOrdonate().filter((c) => c.stare).map((c) => [c.id, `${titluColoana(c)} ${c.subtitlu ?? ''}`])];

      ${r.operator === 'gol' || r.operator.startsWith('este-') ? '' : `<input type="text" data-regula="${i}" data-camp="valoare" value="${escapa(r.valoare ?? '')}" style="inline-size:80px" aria-label="Valoarea">`}
      <select data-regula="${i}" data-camp="tinta" aria-label="Unde">${optiuni([['celula', 'căsuța'], ['rand', 'tot rândul']], r.tinta)}</select>
      ${alegatorCuloare(`regula:${i}:fundal`, '🪣', r.fundal, null)}
      ${alegatorCuloare(`regula:${i}:text`, 'A', r.text, 'var(--text)')}
      <label class="inline"><input type="checkbox" data-regula="${i}" data-camp="gros" ${r.gros ? 'checked' : ''}><b>B</b></label>
      ${buton('sterge-regula', '✕', { titlu: 'Șterge regula', date: `data-i="${i}" `, clasa: 'icon' })}
    </div>`).join('');
    const rapide = setari.axa === 'elevi'
      ? [['absente-rosii', '🔴 Absențele'], ['sub-prag', `🟡 Prezență sub ${setari.prag}%`], ['toata', '🟢 Prezență 100%']]
      : [['absente-rosii', '🔴 Absențele'], ['ore-slabe', '🟡 Ore cu multe absențe']];
    return [
      grup('Reguli', `<div class="lista-p">${reguli}<div class="rand-p">${buton('regula-noua', '＋ Regulă nouă')}${cfg.reguli.length ? buton('sterge-reguli', 'Șterge toate regulile') : ''}</div></div>`),
      grup('Rapide', rapide.map(([id, t]) => buton('regula-rapida', t, { date: `data-v="${id}" ` })).join('')),
    ].join('');
  }

  function filaClase() {

    ].join('');

  function filaSimboluri() {
    const seturi = SETURI.map((set, i) => buton('set-simboluri', set.some(Boolean) ? set.join(' ') : 'doar culoare', { date: `data-i="${i}" ` })).join('');

        <input type="text" data-set="simboluri.${f}.text" value="${escapa(s.text)}" maxlength="4" style="inline-size:52px;text-align:center" aria-label="Simbolul pentru ${NUME_FEL[f]}">
        ${numar_(`simboluri.${f}.marime`, 'mărime', 0.6, 3, 0.1)}
        <label class="inline"><input type="checkbox" data-set="simboluri.${f}.gros" ${s.gros ? 'checked' : ''}><b>B</b></label>

    return [grup('Seturi gata făcute', seturi), grup('Fiecare stare', `<div class="lista-p">${stari}</div>`)].join('');

  function filaAspect() {
    return [
      grup('Temă', alege('tema', TEME)),
      grup('Text', alege('aspect.font', Object.entries(NUME_FONT)) + numar_('aspect.marime', 'mărime', 10, 28) + alege('aspect.aliniere', [['left', '⇤ stânga'], ['center', '≡ mijloc'], ['right', '⇥ dreapta']])),
      grup('Dimensiuni', `<div class="coloana">${numar_('aspect.spatiu', 'Spațiere', 0, 24)}${numar_('aspect.latime', 'Lățime coloane', 30, 240, 2)}</div>
        <div class="coloana">${numar_('aspect.inaltimeAntet', 'Înălțime antet', 0, 200, 2)}${numar_('aspect.rotunjire', 'Colțuri', 0, 24)}</div>
        ${buton('latimi-reset', '↔ Lățimi obișnuite', { dezactivat: !Object.keys(setari.latimi).some((k) => k.startsWith(`${setari.axa}|`)) })}`),
      grup('Linii', `<div class="coloana">${bifa('aspect.grilaO', 'Orizontale')}${bifa('aspect.grilaV', 'Verticale')}</div>${bifa('aspect.dungi', 'Rânduri alternate')}`),
      grup('Îngheață', numar_('aspect.inghetate', 'Coloane fixe', 0, 12)),

  function filaVizualizare() {
    const nume = Object.keys(vederi).sort((a, b) => a.localeCompare(b, 'ro'));
    return [
      grup('Vederi salvate', `${nume.length ? `<select id="vedere" aria-label="Vederea">${optiuni(nume.map((n) => [n, n]), '')}</select>${buton('vedere-aplica', 'Deschide')}${buton('vedere-sterge', '🗑', { titlu: 'Șterge vederea', clasa: 'icon' })}` : ''}${buton('vedere-salveaza', '💾 Salvează vederea…')}`),
      grup('Export', buton('copiaza-tabel', '📋 Copiază tabelul') + buton('csv', '⬇ CSV (Excel)') + buton('tipareste', '🖨 Tipărește')),
      grup('Zoom', buton('zoom-100', '100%') + buton('zoom-potrivit', '↔ Potrivește pe lățime')),
      grup('Început', buton('reset', '↺ Readu tabelul la început', { titlu: 'Tema, rapoartele, notele și coloanele tale rămân' })),

  const FUNCTII_FILE = { acasa: filaAcasa, inserare: filaInserare, date: filaDate, conditionata: filaConditionata, clase: filaClase, simboluri: filaSimboluri, aspect: filaAspect, vizualizare: filaVizualizare };

  function deseneazaPanglica() {
    if (!FUNCTII_FILE[setari.fila]) setari.fila = 'acasa';
    $('#file').innerHTML = FILE.map(([id, t]) => `<button type="button" role="tab" data-fila="${id}" aria-selected="${!setari.uneltePliate && setari.fila === id}">${t}</button>`).join('')
      + `<button type="button" class="dreapta" data-act="plianta" title="${setari.uneltePliate ? 'Arată panglica' : 'Ascunde panglica'}" aria-label="${setari.uneltePliate ? 'Arată panglica' : 'Ascunde panglica'}">${setari.uneltePliate ? '▾' : '▴'}</button>`;
    const continut = $('#continut-fila');
    continut.hidden = setari.uneltePliate;
    if (!setari.uneltePliate) continut.innerHTML = FUNCTII_FILE[setari.fila]();
  }

  $('#file').addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.fila) {
      if (setari.fila === b.dataset.fila && !setari.uneltePliate) return;
      setari.fila = b.dataset.fila; setari.uneltePliate = false;
    } else setari.uneltePliate = !setari.uneltePliate;
    salveaza(); deseneazaPanglica();
  });

  /* ---------- Ce fac controalele din panglică ---------- */

  function scrieLa(cale, valoare) {
    const parti = cale.split('.');
    const obiect = parti.slice(0, -1).reduce((o, k) => o[k], setari);
    obiect[parti.at(-1)] = valoare;
  }
  function valoareControl(t) {
    if (t.type === 'checkbox') return t.checked;
    if (t.type === 'number' || t.type === 'range') { const n = Number(t.value); return Number.isFinite(n) ? n : 0; }
    return t.value;
  }

  function scrieCuloare(cheie, valoare, doarTabel) {
    const [unde, ...rest] = cheie.split(':');
    if (unde === 'sel') { aplicaFormat({ [rest[0]]: valoare }, cheie, doarTabel); return; }
    schimba(() => {
      if (unde === 'simbol') setari.simboluri[rest[0]][rest[1]] = valoare ?? '';
      else if (unde === 'tabel') setari.culori[rest[0]] = valoare ?? '';
      else if (unde === 'clasa') { const c = rest.join(':'); if (valoare) setari.clase.culori[c] = valoare; else delete setari.clase.culori[c]; }
      else if (unde === 'regula') configAxa().reguli[Number(rest[0])][rest[1]] = valoare ?? '';
    }, cheie, doarTabel);
  }

  const panglica = $('#continut-fila');
  panglica.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'cautare') { cautare = t.value; deseneazaTabelul(); return; }
    if (t.dataset.culoare) { t.closest('.culoare')?.classList.remove('auto'); scrieCuloare(t.dataset.culoare, t.value, true); return; }
    if (t.dataset.fmt === 'marime') { aplicaFormat({ marime: Number(t.value) || null }, 'marime', true); return; }
    if (t.dataset.regula != null && t.type === 'text') { schimba(() => { configAxa().reguli[t.dataset.regula].valoare = t.value; }, `regula-${t.dataset.regula}`, true); return; }
    if (t.dataset.set && ['text', 'number', 'range'].includes(t.type)) {
      schimba(() => scrieLa(t.dataset.set, valoareControl(t)), t.dataset.set, true);
      if (t.dataset.set.startsWith('simboluri')) { const mostra = t.closest('.rand-p')?.querySelector('.mostra'); const f = t.dataset.set.split('.')[1]; if (mostra) mostra.innerHTML = simbolHtml(f); deseneazaLegenda(); }
    }
  });
  panglica.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset.fmt && t.tagName === 'SELECT') { aplicaFormat({ [t.dataset.fmt]: t.value || null }); return; }
    if (t.dataset.sortare != null) { schimba(() => { const n = configAxa().sortari[t.dataset.sortare]; n[t.dataset.camp] = t.dataset.camp === 'directie' ? Number(t.value) : t.value; }); return; }
    if (t.dataset.regula != null && t.type !== 'text') { schimba(() => { const r = configAxa().reguli[t.dataset.regula]; r[t.dataset.camp] = t.type === 'checkbox' ? t.checked : t.value; }); return; }
    if (t.dataset.set && (t.tagName === 'SELECT' || t.type === 'checkbox')) {
      const cale = t.dataset.set;
      schimba(() => {
        scrieLa(cale, valoareControl(t));
        if (cale === 'clasa') golesteSelectia();
      });
      if (cale === 'tema') { aplicaTema(); memorieCuloriCss.clear(); deseneazaPanglica(); }
    }
  });

  const REGULI_RAPIDE = {
    'absente-rosii': () => ({ coloana: '@ore', operator: 'este-absent', valoare: '', tinta: 'celula', fundal: '#fecaca', text: '', gros: false }),
    'sub-prag': () => ({ coloana: 'prezenta', operator: 'lt', valoare: String(setari.prag), tinta: 'rand', fundal: '#fef3c7', text: '', gros: false }),
    toata: () => ({ coloana: 'prezenta', operator: 'eq', valoare: '100', tinta: 'celula', fundal: '#bbf7d0', text: '#0f7a4a', gros: true }),
    'ore-slabe': () => ({ coloana: 'absenti', operator: 'ge', valoare: '5', tinta: 'rand', fundal: '#fef3c7', text: '', gros: false }),
  };

  const ACTIUNI = {
    'copiaza-sel': copiazaSelectia,
    pensula: () => { pensula = pensula ? null : formatSelectat(); deseneazaPanglica(); actualizeazaStarea(); },
    fmt: (b) => comutaFormat(b.dataset.p),
    aliniaza: (b) => aplicaFormat({ aliniere: formatSelectat().aliniere === b.dataset.v ? null : b.dataset.v }),
    'sterge-format': stergeFormatarea,
    'coloana-noua': coloanaNoua,
    'nr-crt': () => schimba(() => { const a = configAxa().ascunse; configAxa().ascunse = a.includes('nrcrt') ? a.filter((x) => x !== 'nrcrt') : [...a, 'nrcrt']; }),
    'comuta-col': (b) => schimba(() => { const a = configAxa().ascunse; const id = b.dataset.id; configAxa().ascunse = a.includes(id) ? a.filter((x) => x !== id) : [...a, id]; }),
    'arata-randuri': () => schimba(() => { configAxa().randuriAscunse = []; }),
    'arata-coloane': () => schimba(() => { configAxa().ascunse = []; }),
    axa: (b) => { if (setari.axa !== b.dataset.v) schimba(() => { setari.axa = b.dataset.v; golesteSelectia(); }); },
    'nivel-nou': () => schimba(() => { const folosite = new Set(configAxa().sortari.map((s) => s.coloana)); const c = coloaneOrdonate().find((x) => !x.nrcrt && !folosite.has(x.id)); if (c) configAxa().sortari.push({ coloana: c.id, directie: 1 }); }),
    'sterge-nivel': (b) => schimba(() => { configAxa().sortari.splice(Number(b.dataset.i), 1); }),
    'fara-sortare': () => schimba(() => { configAxa().sortari = []; }),
    'sterge-filtrele': () => schimba(() => { configAxa().filtre = {}; }),
    restrange: () => schimba(() => { setari.grupuriInchise = [...model.clase]; }),
    extinde: () => schimba(() => { setari.grupuriInchise = []; }),
    'regula-noua': () => schimba(() => { configAxa().reguli.push({ coloana: setari.axa === 'elevi' ? 'prezenta' : 'venit', operator: 'lt', valoare: '50', tinta: 'celula', fundal: '#fde68a', text: '', gros: false }); }),
    'regula-rapida': (b) => schimba(() => { configAxa().reguli.push(REGULI_RAPIDE[b.dataset.v]()); }),
    'sterge-regula': (b) => schimba(() => { configAxa().reguli.splice(Number(b.dataset.i), 1); }),
    'sterge-reguli': () => schimba(() => { configAxa().reguli = []; }),
    'set-simboluri': (b) => schimba(() => { SETURI[Number(b.dataset.i)].forEach((t, i) => { setari.simboluri[FELURI[i]].text = t; }); if (!SETURI[Number(b.dataset.i)].some(Boolean)) FELURI.forEach((f, i) => { setari.simboluri[f].fundal = setari.simboluri[f].fundal || ['#bbf7d0', '#fde68a', '#fecaca', '#e9d5ff'][i]; }); }),
    'latimi-reset': () => schimba(() => { for (const k of Object.keys(setari.latimi)) if (k.startsWith(`${setari.axa}|`)) delete setari.latimi[k]; }),
    'vedere-salveaza': async () => {
      const nume = await intreaba('Numele vederii', $('#vedere')?.value ?? 'Vederea mea');
      if (!nume) return;
      const { rapoarte, uneltePliate, tema, fila, ...rest } = setari;
      vederi[nume] = JSON.parse(JSON.stringify(rest));
      salveaza(); deseneazaPanglica();
      const s = $('#vedere'); if (s) s.value = nume;
    },
    'vedere-aplica': () => { const v = vederi[$('#vedere').value]; if (v) schimba(() => { setari = completeaza({ ...JSON.parse(JSON.stringify(v)), tema: setari.tema, rapoarte: setari.rapoarte, fila: setari.fila }); golesteSelectia(); }); },
    'vedere-sterge': () => { delete vederi[$('#vedere').value]; salveaza(); deseneazaPanglica(); },
    'copiaza-tabel': () => copiaza(tabelCaText().map((l) => l.join('\t')).join('\n'), '#stare', 'Tabelul a fost copiat. Îl poți lipi în Excel sau Word.'),
    csv: descarcaCsv,
    tipareste: () => { golesteSelectia(); marcheazaSelectia(); window.print(); },
    'zoom-100': () => schimba(() => { setari.aspect.zoom = 100; }, '', true),
    'zoom-potrivit': () => { const t = cadru.querySelector('table'); if (!t) return; const z = Math.max(50, Math.min(200, Math.floor((cadru.clientWidth / (t.scrollWidth / (setari.aspect.zoom / 100))) * 10) * 10)); schimba(() => { setari.aspect.zoom = z; }, '', true); },
    reset: () => schimba(() => { setari = { ...setariImplicite(), tema: setari.tema, rapoarte: setari.rapoarte, fila: setari.fila }; golesteSelectia(); }),
  };

  panglica.addEventListener('click', (ev) => {
    const auto = ev.target.closest('[data-automat]');
    if (auto) { ev.preventDefault(); scrieCuloare(auto.dataset.automat, null); return; }
    const b = ev.target.closest('[data-act]');
    if (b && ACTIUNI[b.dataset.act]) ACTIUNI[b.dataset.act](b);
  });

  /* =========================================================
     13. COPIERE, CSV, LISTA MARE, RAPOARTE DIRECTE
     ========================================================= */

  async function copiaza(text, unde, mesaj) {
    try { await navigator.clipboard.writeText(text); $(unde).textContent = mesaj; }
    catch { $(unde).textContent = 'Nu am putut copia. Încearcă din nou.'; }
  }

  const titluExport = (c) => titluColoana(c) + (c.subtitlu && (c.elev || c.ora) ? ` ${c.subtitlu}` : '');
  /** Tabelul exact cum îl vezi: coloanele vizibile, rândurile filtrate și sortate, cu Nr. crt. */
  function tabelCaText() {
    const { coloane, randuri } = afisat;
    return [coloane.map(titluExport), ...randuri.map((r, i) => coloane.map((c) => (c.nrcrt ? String(i + 1) : c.text(r))))];
  }
  function copiazaSelectia() {
    if (!selectie.tip) { copiaza(tabelCaText().map((l) => l.join('\t')).join('\n'), '#stare', 'Tabelul a fost copiat.'); return; }
    const { coloane, randuri } = afisat;
    const ri = randuri.map((r, i) => ({ r, i })).filter(({ r }) => coloane.some((c) => esteSelectata(idRand(r), c.id)));
    const ci = coloane.filter((c) => randuri.some((r) => esteSelectata(idRand(r), c.id)));
    const linii = ri.map(({ r, i }) => ci.map((c) => (esteSelectata(idRand(r), c.id) ? (c.nrcrt ? String(i + 1) : c.text(r)) : '')).join('\t'));
    if (selectie.tip !== 'celule') linii.unshift(ci.map(titluExport).join('\t'));
    copiaza(linii.join('\n'), '#stare', `Copiat: ${descriereSelectie()}.`);
  }
  function descarcaCsv() {
    const csv = '﻿' + tabelCaText().map((l) => l.map((v) => `"${String(v).replaceAll('"', '""')}"`).join(';')).join('\r\n');
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: `prezenta-${new Date().toISOString().slice(0, 10)}.csv` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $('#stare').textContent = 'Fișierul CSV a fost descărcat.';
  }

  /** Lista în formatul tău: „1. Avram Ioana – 50 min”, doar cei care au venit. */
  function listaOrei(ora, clasa) {
    return model.elevi
      .filter((e) => (clasa === 'toate' || e.clasa === clasa) && ora.prezente.has(e.cheie))
      .map((e) => ({ e, p: ora.prezente.get(e.cheie) }))
      .sort((a, b) => a.e.nume.localeCompare(b.e.nume, 'ro'));
  }
  function completeazaListele() {
    const ora = $('#lista-ora'); const clasa = $('#lista-clasa');
    const [vo, vc] = [ora.value, clasa.value];
    ora.innerHTML = [...model.ore].reverse().map((o) => `<option value="${escapa(o.id)}">ora din ${escapa(o.titlu)}</option>`).join('') || '<option value="">—</option>';
    clasa.innerHTML = optiuni([['toate', 'toate clasele'], ...model.clase.map((c) => [c, c === FARA_CLASA ? 'fără clasă' : c])], '');
    if ([...ora.options].some((o) => o.value === vo)) ora.value = vo;
    if ([...clasa.options].some((o) => o.value === vc)) clasa.value = vc;
    completeazaTintaRaport();
  }
  $('#copiaza-lista').addEventListener('click', () => {
    const ora = model.ore.find((o) => o.id === $('#lista-ora').value);
    if (!ora) { $('#mesaj-lista').textContent = 'Încă nu există nicio oră.'; return; }
    const clasa = $('#lista-clasa').value;
    const lista = listaOrei(ora, clasa);
    const text = lista.map(({ e, p }, i) => `${i + 1}. ${e.nume} – ${durata(p.minute)}`).join('\n');
    copiaza(text, '#mesaj-lista', `Copiat: ${nElevi(lista.length)} de la ora din ${ora.titlu}${clasa === 'toate' ? '' : `, ${clasa}`}.`);
  });

  function deschideRaport(tip, tinta) {
    $('#raport-tip').value = tip;
    completeazaTintaRaport();
    $('#raport-tinta').value = tinta;
    if ($('#raport-tinta').value !== tinta) { setari.clasa = 'toate'; salveaza(); totul(); $('#raport-tip').value = tip; completeazaTintaRaport(); $('#raport-tinta').value = tinta; }
    $('#fa-raport').click();
  }

  /* =========================================================
     14. ZOOM, TEMA, ANULEAZĂ / REFĂ
     ========================================================= */

  const laZoom = (z) => schimba(() => { setari.aspect.zoom = Math.max(50, Math.min(200, z)); }, 'zoom', true);
  $('#zoom').addEventListener('input', (ev) => laZoom(Number(ev.target.value)));
  $('#zoom-minus').addEventListener('click', () => laZoom(Number(setari.aspect.zoom) - 10));
  $('#zoom-plus').addEventListener('click', () => laZoom(Number(setari.aspect.zoom) + 10));
  cadru.addEventListener('wheel', (ev) => { if (ev.ctrlKey) { ev.preventDefault(); laZoom(Number(setari.aspect.zoom) + (ev.deltaY < 0 ? 10 : -10)); } }, { passive: false });

  function aplicaTema() {
    if (setari.tema && setari.tema !== 'auto') document.documentElement.dataset.tema = setari.tema;
    else delete document.documentElement.dataset.tema;
  }
  $('#anuleaza').addEventListener('click', anuleaza);
  $('#reface').addEventListener('click', reface);
  function completeazaTintaRaport() {
    const tip = $('#raport-tip').value;
    const veche = $('#raport-tinta').value;
    const optiuni = tip === 'elev'
      ? eleviActivi().map((e) => [e.cheie, `${e.nume}${e.clasa !== FARA_CLASA ? ` (${e.clasa})` : ''}`])
      : tip === 'sedinta'
        ? [...model.ore].reverse().map((o) => [o.id, `ora din ${o.titlu}`])
        : model.clase.map((c) => [c, c === FARA_CLASA ? c : `clasa ${c}`]);
    $('#raport-tinta').innerHTML = optiuni.map(([v, t]) => `<option value="${escapa(v)}">${escapa(t)}</option>`).join('');
    if (optiuni.some(([v]) => v === veche)) $('#raport-tinta').value = veche;
  }
  $('#raport-tip').addEventListener('change', completeazaTintaRaport);

  const perioada = () => (model.ore.length ? `${model.ore[0].titlu} – ${model.ore.at(-1).titlu} ${new Date(model.ore.at(-1).inceputMs).getFullYear()}` : '');
  const generat = () => `Generat pe ${ziAn.format(Date.now())}, din datele Google Meet${model.actualizat ? ` actualizate pe ${ziSiOra.format(model.actualizat)}` : ''}.`;
  const cifreHtml = (lista) => `<div class="cifre">${lista.map(([b, s]) => `<div class="cifra"><b>${escapa(b)}</b><span>${escapa(s)}</span></div>`).join('')}</div>`;
  const NUME_TIP = { elev: 'Raport per elev', sedinta: 'Raport per ședință', clasa: 'Raport per clasă' };

  /** Înlocuiește {elev}, {clasa}, {data} … cu valorile raportului. Ce nu recunoaște rămâne neschimbat. */
  const completeazaSablon = (text, valori) => String(text ?? '').replace(/\{(\w+)\}/g, (tot, cheie) => (cheie in valori ? valori[cheie] : tot));

  function statisticiElev(e) {
    const stari = model.ore.map((o) => ({ o, s: stare(e, o) }));
    const venit = stari.filter((x) => !esteAbsent(x.s));
    return {
      stari, venit: venit.length,
      procent: model.ore.length ? Math.round((venit.length * 100) / model.ore.length) : 0,
      minute: venit.reduce((a, x) => a + x.s.minute, 0),
      absente: stari.filter((x) => esteAbsent(x.s)),
      motivate: stari.filter((x) => x.s.fel === 'motivat'),
      partiale: stari.filter((x) => x.s.fel === 'partial'),
    };
  }

  /** Partea comună a oricărui raport: antetul școlii, titlul, subtitlul; la final observațiile și semnătura. */
  function invelisRaport(cfg, valori, corp) {
    const c = setari.rapoarte.comun;
    const accent = culoareSigura(c.accent);
    const stil = `--marime-raport:${Number(c.marime) || 14}px;${accent ? `--accent-raport:${accent}` : ''}`;
    const subtitlu = completeazaSablon(cfg.subtitlu, valori);
    const observatii = completeazaSablon(cfg.observatii, valori).trim();
    const html = `<article class="foaie-raport" style="${stil}">
      ${c.aratScoala && c.scoala.trim() ? `<div class="scoala">${escapa(c.scoala)}</div>` : ''}
      <h2 id="raport-titlu">${escapa(completeazaSablon(cfg.titlu, valori))}</h2>
      ${subtitlu ? `<p class="sub">${escapa(subtitlu)}</p>` : ''}
      ${corp.html}
      ${observatii ? `<div class="observatii">${escapa(observatii)}</div>` : ''}
      ${c.aratGenerat || c.aratSemnatura ? `<p class="semnatura">${c.aratGenerat ? escapa(generat()) : ''}${c.aratGenerat && c.aratSemnatura ? '<br>' : ''}${c.aratSemnatura ? escapa(c.semnatura) : ''}</p>` : ''}
    </article>`;
    const text = [
      ...(c.aratScoala && c.scoala.trim() ? [c.scoala, ''] : []),
      completeazaSablon(cfg.titlu, valori),
      ...(subtitlu ? [subtitlu] : []),
      ...corp.text,
      ...(observatii ? ['', observatii] : []),
      ...(c.aratSemnatura ? ['', c.semnatura] : []),
    ].join('\n');
    return { html, text };
  }

  function raportElev(cheie) {
    const e = model.elevi.find((x) => x.cheie === cheie);
    if (!e) return null;
    const cfg = setari.rapoarte.elev;
    const sec = cfg.sectiuni;
    const st = statisticiElev(e);
    const valori = { elev: e.nume, clasa: e.clasa, perioada: perioada(), ore: nOre(model.ore.length), procent: `${st.procent}%` };
    const prezenta = (s, o) => {
      if (esteAbsent(s)) return s.fel === 'motivat' ? 'a lipsit (motivat)' : 'a lipsit';
      const parti = [sec.minute ? `${s.minute} din ${o.durataMinute} min` : 'prezent', sec.procent ? `(${s.procent}%)` : ''];
      return parti.filter(Boolean).join(' ');
    };
    const corpHtml = [
      sec.cifre ? cifreHtml([[`${st.venit} / ${model.ore.length}`, 'ore la care a fost'], [`${st.procent}%`, 'prezență'], [durata(st.minute), 'timp în total'], [String(st.absente.length), st.motivate.length ? `absențe (${st.motivate.length} motivate)` : 'absențe'], [String(st.partiale.length), `ore sub ${setari.prag}%`]]) : '',
      sec.tabel ? `<h3>Ora cu ora</h3><table><thead><tr><th>Nr.</th><th>Data</th>${sec.interval ? '<th>Ora</th>' : ''}<th>Prezența</th></tr></thead><tbody>
        ${st.stari.map(({ o, s }, i) => `<tr><td>${i + 1}</td><td>${escapa(ziLunga.format(o.inceputMs))}</td>${sec.interval ? `<td>${intervalOra(o)}</td>` : ''}<td class="${s.fel === 'absent' ? 'rosu' : s.fel === 'partial' ? 'galben' : ''}">${escapa(prezenta(s, o))}</td></tr>`).join('')}
      </tbody></table>` : '',
    ].join('');
    const corpText = [
      `A fost la ${st.venit} din ${nOre(model.ore.length)} (${st.procent}%), ${nMinute(st.minute)} în total, ${st.absente.length} absențe${st.motivate.length ? ` (${st.motivate.length} motivate)` : ''}, ${st.partiale.length} ore sub ${setari.prag}%.`,
      ...(sec.tabel ? ['', ...st.stari.map(({ o, s }, i) => `${i + 1}. ${o.titlu} – ${prezenta(s, o)}`)] : []),
    ];
    return invelisRaport(cfg, valori, { html: corpHtml, text: corpText });
  }

  const numeLipsa = (e, o) => (date.motivari[`${e.cheie}|${o.id}`] ? `${e.nume} (motivat)` : e.nume);

  function raportSedinta(oraId) {
    const o = model.ore.find((x) => x.id === oraId);
    if (!o) return null;
    const cfg = setari.rapoarte.sedinta;
    const sec = cfg.sectiuni;
    const clase = model.clase.filter((c) => setari.clasa === 'toate' || c === setari.clasa);
    const blocuri = clase.map((c) => {
      const elevi = model.elevi.filter((e) => e.clasa === c);
      const venit = listaOrei(o, c);
      const lipsa = elevi.filter((e) => !o.prezente.has(e.cheie));
      if (!venit.length && !lipsa.length) return null;
      return { c, elevi, venit, lipsa, partial: venit.filter(({ p }) => p.procent < setari.prag) };
    }).filter(Boolean);
    const valori = { data: ziLunga.format(o.inceputMs), ora: intervalOra(o), durata: durata(o.durataMinute), clasa: setari.clasa === 'toate' ? clase.join(', ') : setari.clasa };
    const titluBloc = (b) => `${b.c === FARA_CLASA ? 'Elevi fără clasă' : `Clasa ${b.c}`} – au venit ${b.venit.length} din ${b.elevi.length}`;
    const minuteText = (p) => [sec.minute ? `${p.minute} din ${o.durataMinute}` : '', sec.procent ? `(${p.procent}%)` : ''].filter(Boolean).join(' ');
    const corpHtml = [
      sec.cifre ? cifreHtml([[String(blocuri.reduce((a, b) => a + b.venit.length, 0)), 'au venit'], [String(blocuri.reduce((a, b) => a + b.lipsa.length, 0)), 'au lipsit'], [String(blocuri.reduce((a, b) => a + b.partial.length, 0)), `sub ${setari.prag}% din oră`]]) : '',
      ...blocuri.map((b) => `
        <h3>${escapa(titluBloc(b))}</h3>
        <table><thead><tr><th>Nr.</th><th>Elev</th>${sec.minute || sec.procent ? '<th>Minute</th>' : ''}${sec.intrare ? '<th>Intrare – ieșire</th>' : ''}</tr></thead><tbody>
        ${b.venit.map(({ e, p }, i) => `<tr><td>${i + 1}</td><td>${escapa(e.nume)}</td>${sec.minute || sec.procent ? `<td class="${p.procent < setari.prag ? 'galben' : ''}">${escapa(minuteText(p))}</td>` : ''}${sec.intrare ? `<td>${p.primaIntrare ? `${oraMinut.format(Date.parse(p.primaIntrare))}–${oraMinut.format(Date.parse(p.ultimaIesire))}` : '–'}</td>` : ''}</tr>`).join('')}
        </tbody></table>
        ${sec.absenti ? (b.lipsa.length ? `<p><span class="rosu">Au lipsit (${b.lipsa.length}):</span> ${b.lipsa.map((e) => escapa(numeLipsa(e, o))).join(', ')}</p>` : '<p>Nu a lipsit nimeni.</p>') : ''}`),
    ].join('');
    const corpText = blocuri.flatMap((b) => [
      '', `${titluBloc(b)}:`,
      ...b.venit.map(({ e, p }, i) => `${i + 1}. ${e.nume}${sec.minute ? ` – ${durata(p.minute)}` : ''}`),
      ...(sec.absenti ? [b.lipsa.length ? `Au lipsit (${b.lipsa.length}): ${b.lipsa.map((e) => numeLipsa(e, o)).join(', ')}` : 'Nu a lipsit nimeni.'] : []),
    ]);
    return invelisRaport(cfg, valori, { html: corpHtml, text: corpText });
  }

  function raportClasa(clasa) {
    const elevi = model.elevi.filter((e) => e.clasa === clasa);
    if (!elevi.length) return null;
    const cfg = setari.rapoarte.clasa;
    const sec = cfg.sectiuni;
    const statistici = elevi.map((e) => ({ e, st: statisticiElev(e) }));
    const media = Math.round(statistici.reduce((a, x) => a + x.st.procent, 0) / statistici.length);
    const sub = statistici.filter((x) => x.st.procent < setari.prag);
    const valori = { clasa, perioada: perioada(), elevi: nElevi(elevi.length), ore: nOre(model.ore.length), media: `${media}%` };
    const corpHtml = [
      sec.cifre ? cifreHtml([[`${media}%`, 'media prezenței'], [String(model.ore.length), 'ore ținute'], [String(statistici.filter((x) => x.st.procent === 100).length), 'n-au lipsit deloc'], [String(sub.length), `sub ${setari.prag}% prezență`]]) : '',
      sec.elevi ? `<h3>Elevii, alfabetic</h3><table><thead><tr><th>Nr.</th><th>Elev</th><th>Ore</th><th>Prezență</th>${sec.minute ? '<th>Minute</th>' : ''}${sec.absente ? '<th>Absențe</th>' : ''}</tr></thead><tbody>
        ${statistici.map(({ e, st }, i) => `<tr><td>${i + 1}</td><td>${escapa(e.nume)}</td><td>${st.venit}/${model.ore.length}</td><td class="${st.procent < setari.prag ? 'rosu' : ''}">${st.procent}%</td>${sec.minute ? `<td>${st.minute}</td>` : ''}${sec.absente ? `<td>${st.absente.length}</td>` : ''}</tr>`).join('')}
      </tbody></table>` : '',
      sec.ore ? `<h3>Orele</h3><table><thead><tr><th>Data</th><th>Ora</th><th>Au venit</th></tr></thead><tbody>
        ${model.ore.map((o) => `<tr><td>${escapa(ziLunga.format(o.inceputMs))}</td><td>${intervalOra(o)}</td><td>${elevi.filter((e) => o.prezente.has(e.cheie)).length} din ${elevi.length}</td></tr>`).join('')}
      </tbody></table>` : '',
      sec.urmarit && sub.length ? `<h3>De urmărit (sub ${setari.prag}% prezență)</h3><p>${sub.map(({ e, st }) => `${escapa(e.nume)} (${st.procent}%)`).join(', ')}</p>` : '',
    ].join('');
    const pePrezenta = [...statistici].sort((a, b) => b.st.procent - a.st.procent || b.st.minute - a.st.minute);
    const corpText = [
      `Media prezenței: ${media}% (${nOre(model.ore.length)})`,
      ...(sec.elevi ? ['', ...pePrezenta.map(({ e, st }, i) => `${i + 1}. ${e.nume} – ${st.venit} din ${nOre(model.ore.length)} (${st.procent}%)`)] : []),
      ...(sec.urmarit && sub.length ? ['', `De urmărit (sub ${setari.prag}%): ${sub.map(({ e }) => e.nume).join(', ')}`] : []),
    ];
    return invelisRaport(cfg, valori, { html: corpHtml, text: corpText });
  }

  /* ---------- Setările raportului (coloana din stânga a ferestrei) ---------- */

  const SECTIUNI = {
    elev: [['cifre', 'Cifrele de sus'], ['tabel', 'Tabelul ora cu ora'], ['interval', 'Coloana „Ora” (15:00–15:50)'], ['minute', 'Minutele la fiecare oră'], ['procent', 'Procentul din oră']],
    sedinta: [['cifre', 'Cifrele de sus'], ['minute', 'Minutele fiecărui elev'], ['procent', 'Procentul din oră'], ['intrare', 'Coloana „Intrare – ieșire”'], ['absenti', 'Lista „Au lipsit”']],
    clasa: [['cifre', 'Cifrele de sus'], ['elevi', 'Tabelul elevilor'], ['minute', 'Coloana „Minute”'], ['absente', 'Coloana „Absențe”'], ['ore', 'Tabelul orelor'], ['urmarit', 'Lista „De urmărit”']],
  };
  const CAMPURI = {
    elev: ['{elev}', '{clasa}', '{perioada}', '{ore}', '{procent}'],
    sedinta: ['{data}', '{ora}', '{durata}', '{clasa}'],
    clasa: ['{clasa}', '{perioada}', '{elevi}', '{ore}', '{media}'],
  };

  let raportDeschis = null;     // { tip, tinta, rezultat, editat }

  function deseneazaSetariRaport(tip) {
    const cfg = setari.rapoarte[tip];
    const c = setari.rapoarte.comun;
    $('#raport-setari').innerHTML = `
      <section>
        <h3>Textele</h3>
        <label class="camp">Titlul <input type="text" data-r="${tip}.titlu" value="${escapa(cfg.titlu)}"></label>
        <label class="camp">Subtitlul <input type="text" data-r="${tip}.subtitlu" value="${escapa(cfg.subtitlu)}"></label>
        <label class="camp">Observații (apar la final) <textarea data-r="${tip}.observatii" placeholder="De exemplu: Rog dirigintele să discute cu elevii care lipsesc des.">${escapa(cfg.observatii)}</textarea></label>
        <p class="nota">Câmpuri care se completează singure: ${CAMPURI[tip].map((x) => `<code>${x}</code>`).join(' ')}</p>
      </section>
      <section>
        <h3>Ce apare în raport</h3>
        ${SECTIUNI[tip].map(([id, nume]) => `<label class="bifa"><input type="checkbox" data-r="${tip}.sectiuni.${id}" ${cfg.sectiuni[id] ? 'checked' : ''}> ${nume}</label>`).join('')}
      </section>
      <section>
        <h3>Antet și semnătură <span class="nota">(la toate rapoartele)</span></h3>
        <label class="bifa"><input type="checkbox" data-r="comun.aratScoala" ${c.aratScoala ? 'checked' : ''}> Numele școlii, sus</label>
        <input type="text" data-r="comun.scoala" value="${escapa(c.scoala)}" aria-label="Numele școlii">
        <label class="bifa"><input type="checkbox" data-r="comun.aratSemnatura" ${c.aratSemnatura ? 'checked' : ''}> Semnătura, jos</label>
        <input type="text" data-r="comun.semnatura" value="${escapa(c.semnatura)}" aria-label="Semnătura">
        <label class="bifa"><input type="checkbox" data-r="comun.aratGenerat" ${c.aratGenerat ? 'checked' : ''}> Data la care a fost generat</label>
      </section>
      <section>
        <h3>Aspect</h3>
        <label class="bifa">Mărimea textului <input type="number" min="10" max="20" step="1" data-r="comun.marime" value="${Number(c.marime)}" style="inline-size:64px"> px</label>
        <div class="bifa">Culoarea titlurilor ${alegatorCuloare('raport:accent', 'culoare', c.accent, '#1b2130')}</div>
      </section>
      <button class="btn mic" type="button" id="raport-setari-reset">Readu setările acestui raport la început</button>`;
  }

  function scrieSetareRaport(cale, valoare) {
    const parti = cale.split('.');
    let obiect = setari.rapoarte;
    for (const p of parti.slice(0, -1)) obiect = obiect[p];
    obiect[parti.at(-1)] = valoare;
  }

  function genereazaRaport() {
    const { tip, tinta } = raportDeschis;
    raportDeschis.rezultat = { elev: raportElev, sedinta: raportSedinta, clasa: raportClasa }[tip](tinta);
    raportDeschis.editat = false;
    $('#raport-continut').innerHTML = raportDeschis.rezultat?.html ?? '<p class="gol">Nu am ce pune în raport.</p>';
    const foaie = $('#raport-continut .foaie-raport');
    if (foaie) {
      foaie.contentEditable = 'true';
      foaie.spellcheck = true;
      foaie.addEventListener('input', () => { raportDeschis.editat = true; $('#mesaj-raport').textContent = 'Ai modificat raportul direct. „Refă raportul” îl readuce la forma inițială.'; });
    }
  }

  $('#raport-setari').addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.culoare === 'raport:accent') { setari.rapoarte.comun.accent = t.value; t.closest('.culoare').classList.remove('auto'); }
    else if (t.dataset.r && t.type !== 'checkbox') scrieSetareRaport(t.dataset.r, t.type === 'number' ? Number(t.value) || 14 : t.value);
    else return;
    salveaza(); genereazaRaport();
  });
  $('#raport-setari').addEventListener('change', (ev) => {
    const t = ev.target;
    if (!t.dataset.r || t.type !== 'checkbox') return;
    scrieSetareRaport(t.dataset.r, t.checked);
    salveaza(); genereazaRaport();
  });
  $('#raport-setari').addEventListener('click', (ev) => {
    if (ev.target.closest('[data-automat="raport:accent"]')) { setari.rapoarte.comun.accent = ''; }
    else if (ev.target.closest('#raport-setari-reset')) {
      const b = rapoarteImplicite();
      setari.rapoarte[raportDeschis.tip] = b[raportDeschis.tip];
    } else return;
    salveaza(); deseneazaSetariRaport(raportDeschis.tip); genereazaRaport();
  });

  $('#fa-raport').addEventListener('click', () => {
    const tip = $('#raport-tip').value;
    const tinta = $('#raport-tinta').value;
    if (!tinta) return;
    raportDeschis = { tip, tinta };
    $('#raport-nume-tip').textContent = NUME_TIP[tip];
    $('#mesaj-raport').textContent = '';
    deseneazaSetariRaport(tip);
    genereazaRaport();
    $('#raport').showModal();
  });
  $('#raport-inchide').addEventListener('click', () => $('#raport').close());
  $('#raport-reface').addEventListener('click', () => { genereazaRaport(); $('#mesaj-raport').textContent = 'Raportul a fost refăcut.'; });

  /** Textul de copiat: dacă ai modificat raportul direct, se copiază exact ce vezi. */
  function textulRaportului() {
    if (!raportDeschis.editat) return raportDeschis.rezultat.text;
    const foaie = $('#raport-continut .foaie-raport');
    return foaie.innerText.replace(/\n{3,}/g, '\n\n').trim();
  }
  $('#raport-copiaza').addEventListener('click', () => {
    if (!raportDeschis?.rezultat) return;
    copiaza(textulRaportului(), '#mesaj-raport', 'Textul raportului a fost copiat.');
  });
  $('#raport-pdf').addEventListener('click', () => {
    if (!raportDeschis?.rezultat) return;
    // Tipărim doar raportul, așa cum arată acum (cu modificările tale); din fereastra de tipărire alegi „Salvează ca PDF”.
    const copie = $('#raport-continut .foaie-raport').cloneNode(true);
    copie.removeAttribute('contenteditable');
    $('#zona-tipar').replaceChildren(copie);
    $('#raport').close();
    document.body.classList.add('tipar');
    window.print();
  });
  window.addEventListener('afterprint', () => { document.body.classList.remove('tipar'); $('#zona-tipar').replaceChildren(); });


  /* =========================================================
     15. PORNIREA
     ========================================================= */

  function totul() {
    deseneazaPanglica();
    deseneazaTabelul();
    completeazaListele();
    $('#anuleaza').disabled = !istoric.inapoi.length;
    $('#reface').disabled = !istoric.inainte.length;
  }

  aplicaTema();

  window.Prezenta = {
    /** Apelează asta de pe site, după ce ai încărcat datele (de ex. din Supabase). */
    afiseaza(dateNoi) {
      model = construiesteModel(dateNoi);
      if (setari.clasa !== 'toate' && !model.clase.includes(setari.clasa)) setari.clasa = 'toate';
      $('#actualizat').textContent = model.actualizat ? `Actualizat ${ziSiOra.format(model.actualizat)} · ${nOre(model.ore.length)} · ${nElevi(model.elevi.length)}` : '';
      totul();
    },
    /** Un mesaj în locul tabelului (de ex. „Nu ai acces” sau o eroare la încărcare). */
    mesaj(titlu, text) {
      cadru.innerHTML = `<div class="gol"><h2>${escapa(titlu)}</h2><p>${escapa(text)}</p></div>`;
    },
    /** Memoria adusă din cont (de pe alt calculator): o pune în locul celei din browser. */
    incarcaMemoria(m) {
      setari = completeaza(m?.setari ?? {});
      date = { ...dateImplicite(), ...(m?.date ?? {}) };
      vederi = m?.vederi ?? {};
      istoric.inapoi = []; istoric.inainte = [];
      try { localStorage.setItem(CHEIE_MEMORIE, JSON.stringify({ setari, date, vederi })); } catch {}
      aplicaTema(); totul();
    },
    /** Memoria de acum, ca s-o poată duce situl în cont. */
    memoria: () => ({ setari, date, vederi }),
  };

  const ePentruProba = location.protocol === 'file:' || new URLSearchParams(location.search).has('proba');
  if (window.PREZENTA_DATE) window.Prezenta.afiseaza(window.PREZENTA_DATE);
  else if (ePentruProba) window.Prezenta.afiseaza(DATE_DE_PROBA);
  else { totul(); window.Prezenta.mesaj('Se încarcă prezența…', 'Datele vin din tabelul Google, prin baza de date a site-ului.'); }
  </script>
  <!-- ===== LEGĂTURA CU SITUL (adăugată peste prezenta.html) =====
       Numai profesorul primește datele: baza le dă doar adminului (RLS, migrările
       0110 și 0111), aici doar alegem mesajul. Prezența vine din tabelul Google,
       prin funcția `primeste-prezenta`. Cu `?proba` rămân datele de probă inventate.

       MEMORIA ÎN CONT. Tot ce ține pagina (setări, simboluri, coloane, vederi,
       note, motivări) stă în browser ȘI în `prezenta_memorie`. La deschidere
       câștigă varianta mai nouă: dacă ai lucrat pe alt calculator, o iei de
       acolo; dacă aici e ceva încă netrimis, se trimite. Fiecare salvare a
       paginii pleacă în cont după o clipă de liniște. -->
  <script type="module">
    import { supabase } from "../../src/shared/scripts/supabase-client.js";
    import { roleForEmail } from "../../src/shared/scripts/session.js";

    /* „← Înapoi”: dacă ai venit de pe sit, te duce exact acolo (cu tot cu locul din pagină);
       dacă ai deschis adresa direct, te duce pe prima pagină. */
    document.getElementById("inapoi")?.addEventListener("click", (ev) => {
      let deAici = false;
      try { deAici = new URL(document.referrer).origin === location.origin; } catch {}
      if (deAici && history.length > 1) { ev.preventDefault(); history.back(); }
    });

    const CHEIE_MEMORIE = "prezenta-tabel-v3";
    const CHEIE_CAND = "prezenta-tabel-v3:cand";   // când s-a schimbat ultima oară memoria din browserul ăsta
    const ia = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
    const pune = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

    /* ---------- Trimiterea în cont, cu o clipă de așteptare între salvări ---------- */
    let deTrimis = null;
    let ceas = null;
    async function trimite() {
      clearTimeout(ceas); ceas = null;
      if (!deTrimis) return;
      const { memorie, cand } = deTrimis;
      deTrimis = null;
      const { error } = await supabase.from("prezenta_memorie")
        .upsert({ id: 1, memorie, actualizat: new Date(cand).toISOString() });
      if (error) console.warn("prezenta: memoria n-a ajuns în cont:", error.message);
    }
    function programeaza(memorie, cand = Date.now()) {
      pune(CHEIE_CAND, String(cand));
      deTrimis = { memorie, cand };
      clearTimeout(ceas);
      ceas = setTimeout(trimite, 1200);
    }
    /* Pleci de pe pagină: ce era pe drum pleacă acum, nu după pauză. */
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") trimite(); });

    async function potrivesteMemoria() {
      const { data, error } = await supabase.from("prezenta_memorie").select("memorie, actualizat").eq("id", 1).maybeSingle();
      if (error) { console.warn("prezenta: n-am putut citi memoria din cont:", error.message); return; }
      const aici = Number(ia(CHEIE_CAND)) || 0;
      const inCont = data ? Date.parse(data.actualizat) : 0;
      if (data && inCont >= aici) {
        Prezenta.incarcaMemoria(data.memorie);
        pune(CHEIE_CAND, String(inCont));
      } else if (ia(CHEIE_MEMORIE) != null) {
        programeaza(Prezenta.memoria(), aici || Date.now());
        trimite();
      }
      Prezenta.candSalvez = (m) => programeaza(m);
    }

    if (!new URLSearchParams(location.search).has("proba")) {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (roleForEmail(session?.user?.email) !== "admin") {
          Prezenta.mesaj("Nu ai acces", "Pagina e doar pentru profesor.");
        } else {
          const [, { data, error }] = await Promise.all([
            potrivesteMemoria(),
            supabase.from("prezenta_export").select("date").eq("id", 1).maybeSingle(),
          ]);
          if (error) Prezenta.mesaj("Nu am putut încărca prezența", error.message);
          else if (!data) Prezenta.mesaj("Încă nicio oră", "Din tabelul Google: Prezență → Adu prezența.");
          else Prezenta.afiseaza(data.date);
        }
      } catch (err) {
        Prezenta.mesaj("Nu am putut încărca prezența", err?.message || String(err));
      }
    }
  </script>
</body>
</html>
